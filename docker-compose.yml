services:
  postgres:
    image: postgres:18
    container_name: nango_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urls-network
    ports:
      - "${DB_PORT}:5432"

  app:
    build:
      context: .
    container_name: nango-app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 10s
    environment:
        - HTTP_PORT=8080
        - LOG_FORMAT=${LOG_FORMAT}
        - BASE_URL=${BASE_URL}
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_NAME=${DB_NAME}
        - DB_SSL_MODE=${DB_SSL_MODE}
        - MIGRATION_DIR=${MIGRATION_DIR}
        - DB_MAX_OPEN_CONNECTIONS=${DB_MAX_OPEN_CONNECTIONS}
        - DB_MAX_IDLE_CONNECTIONS=${DB_MAX_IDLE_CONNECTIONS}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    networks:
      - urls-network
    restart: unless-stopped

volumes:
  pg_data:

networks:
  urls-network:

